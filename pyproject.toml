[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voxtypex"
version = "0.1.0"
description = "Windows push-to-talk voice input"
requires-python = ">=3.12"
dependencies = ["PySide6==6.11.2", "sounddevice==0.5.6", "pynput==1.8.2", "faster-whisper==1.2.1", "numpy>=2,<3", "comtypes==1.4.16"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[project.gui-scripts]
voxtypex = "voxtypex.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".local", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Select Qt's headless platform before importing its widgets.
"tests/test_ui.py" = ["E402"]
